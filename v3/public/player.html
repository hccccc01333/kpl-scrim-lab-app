<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回放播放器 · KPL 赛训平台</title>
<style>
  :root {
    --bg: #0b1418;
    --panel: #111d23;
    --line: rgba(255,255,255,.09);
    --ink: #e7eef2;
    --muted: rgba(231,238,242,.56);
    --blue: #6ea8fe;
    --red: #f08a6c;
    --accent: #57c7a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 15% -10%, #14262c, var(--bg));
    color: var(--ink);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  #player { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }
  .rp-loading, .rp-error {
    padding: 40px; text-align: center; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 14px;
  }
  .rp-error { color: var(--red); }
  .rp-head {
    display: grid; grid-template-columns: 1fr 320px; gap: 24px;
    align-items: end; padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .rp-eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  .rp-head h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  .rp-win { color: var(--blue); }
  .rp-sub { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; }
  .rp-head-note {
    font-size: 12.5px; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .rp-head-note b { color: var(--ink); }
  .rp-roster { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
  .rp-chip {
    display: grid; grid-template-columns: auto auto; gap: 0 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--team); border-radius: 10px;
    padding: 7px 11px; color: var(--ink); font: inherit; cursor: pointer; text-align: left;
  }
  .rp-chip:hover { border-color: var(--team); }
  .rp-chip-team { font-size: 10.5px; color: var(--muted); grid-column: 1 / -1; }
  .rp-chip b { font-weight: 600; font-size: 13px; }
  .rp-chip small { color: var(--muted); font-size: 11px; }
  .rp-mvp {
    grid-column: 1 / -1; font-style: normal; font-size: 10px;
    color: #0b1418; background: #e7c65a; border-radius: 4px; padding: 0 5px; width: max-content;
  }
  .rp-chip-stat { grid-column: 1 / -1; font-size: 11px; color: var(--accent); }
  .rp-timeline {
    display: flex; align-items: center; gap: 12px; margin: 8px 0 20px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  }
  .rp-play {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: #16262d; color: var(--ink); cursor: pointer; font-size: 13px;
  }
  .rp-range { flex: 1; accent-color: var(--accent); }
  .rp-clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; min-width: 96px; }
  .rp-speed {
    background: #16262d; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font: inherit;
  }
  .rp-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .rp-chart {
    margin: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px 6px;
  }
  .rp-chart figcaption { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .rp-chart canvas { width: 100%; height: 168px; display: block; }
  .rp-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .rp-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px;
  }
  .rp-card-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .rp-card-head b { font-size: 13px; }
  .rp-card-head small { color: var(--muted); font-size: 10.5px; width: 100%; }
  .rp-card-head i { color: #e7c65a; font-style: normal; font-size: 10.5px; }
  .rp-dot { width: 8px; height: 8px; border-radius: 50%; }
  .rp-card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 9px 0; }
  .rp-card dl div { display: flex; justify-content: space-between; font-size: 11.5px; }
  .rp-card dt { color: var(--muted); }
  .rp-card dd { margin: 0; font-variant-numeric: tabular-nums; }
  .rp-bars { display: grid; gap: 3px; margin-top: 6px; }
  .rp-bars span { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; position: relative; height: 13px; }
  .rp-bars span i { position: absolute; left: 0; top: 3px; height: 3px; border-radius: 2px; min-width: 1px; }
  .rp-bars span u { grid-column: 1; text-decoration: none; font-size: 9.5px; color: var(--muted); padding-left: 8px; }
  .rp-bars span b { font-size: 9.5px; color: var(--muted); font-weight: 500; }
  .rp-events { margin-top: 22px; }
  .rp-events h2, .rp-gaps h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .rp-events ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .rp-events li {
    display: flex; gap: 9px; align-items: baseline; font-size: 12.5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  .rp-events time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .rp-k { font-size: 10px; padding: 1px 5px; border-radius: 4px; }
  .rp-k-buy { background: rgba(240,138,108,.16); color: var(--red); }
  .rp-k-skill { background: rgba(201,162,39,.16); color: #e7c65a; }
  .rp-events i { color: var(--muted); font-style: normal; }
  .rp-empty { color: var(--muted); justify-content: center; }
  .rp-ope { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }
  .rp-plans { margin-top: 8px; font-size: 11px; }
  .rp-plans summary { color: var(--muted); cursor: pointer; }
  .rp-plans ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 5px; }
  .rp-plans li b { display: block; color: var(--ink); font-weight: 600; }
  .rp-plans li span { color: var(--muted); line-height: 1.5; }
  .rp-anchors { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }
  .rp-anchors h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .rp-anchors-body { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
  .rp-anchors figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .rp-anchors canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  .rp-anchors figcaption { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .rp-anchor-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 11.5px; }
  .rp-anchor-list li { display: flex; gap: 8px; align-items: baseline; }
  .rp-anchor-list time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .rp-anchor-list small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .rp-anchors-note { font-size: 11.5px; color: var(--muted); margin: 10px 0 0; }
  @media (max-width: 980px) { .rp-anchors-body { grid-template-columns: 1fr; } }
  .rp-ope h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .rp-ope-empty, .rp-ope-caveat { font-size: 12px; color: var(--muted); }
  .rp-ope-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .rp-ope-stats div {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .rp-ope-stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .rp-ope-stats span { font-size: 11px; color: var(--muted); }
  .rp-ope-body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  .rp-ope figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .rp-ope figcaption { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .rp-ope-types, .rp-ope-repairs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .rp-ope-types li {
    display: grid; grid-template-columns: 132px 1fr 52px; align-items: center; gap: 8px;
    font-size: 11.5px; position: relative;
  }
  .rp-ope-types span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-ope-types i { height: 4px; border-radius: 2px; background: var(--accent); max-width: 100%; }
  .rp-ope-types b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .rp-ope-repairs li {
    display: flex; gap: 8px; align-items: baseline; font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  .rp-ope-repairs code { color: #e7c65a; font-family: ui-monospace, monospace; }
  .rp-ope-repairs span { color: var(--accent); }
  .rp-ope-repairs small { color: var(--muted); }
  @media (max-width: 980px) {
    .rp-ope-stats { grid-template-columns: repeat(2, 1fr); }
    .rp-ope-body { grid-template-columns: 1fr; }
  }
  .rp-gaps { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }  .rp-gaps ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .rp-gaps li { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: 120px 1fr; gap: 10px; }
  .rp-gaps b { color: var(--ink); font-weight: 600; }
  @media (max-width: 980px) {
    .rp-head { grid-template-columns: 1fr; }
    .rp-charts { grid-template-columns: 1fr; }
    .rp-cards { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<main id="player"></main>
<script type="module">
import { mount } from '/static/replay-player.js';
const params = new URLSearchParams(location.search);
const replayId = params.get('replay') || params.get('id') || '';
const root = document.querySelector('#player');
if (!replayId) {
  root.innerHTML = '<div class="rp-error">缺少 replay 参数：请用 ?replay=&lt;回放ID&gt; 打开。</div>';
} else {
  mount(root, replayId);
}
</script>
</body>
</html>
