name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Deploy smoke test
        run: python scripts/check_deploy.py
      - name: Replay helpers tests
        run: |
          # 公开仓库只带运行时可复现的回放辅助测试；依赖私有样本/编码器的
          # 用例留在源码工作区，不随开源仓库分发。
          python -m unittest tests.test_replay_profiles tests.test_replay_frame_commands -v
      - name: Full Python test suite
        run: python -m pytest tests -q --disable-warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax check
        run: |
          shopt -s nullglob
          files=(web/*.js v3/public/*.js)
          printf 'checking %d files\n' "${#files[@]}"
          for f in "${files[@]}"; do node --experimental-default-type=module --check "$f"; done
