name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Deploy smoke test
        run: python scripts/check_deploy.py
      - name: Replay/checkpoint tests
        run: |
          python -m unittest \
            tests.test_replay_checkpoints_api \
            tests.test_replay_inputs_api \
            tests.test_replay_profiles \
            tests.test_state_series_checkpoints \
            tests.test_replay_frame_commands -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax check
        run: |
          for f in web/*.js; do node --experimental-default-type=module --check "$f"; done
      - name: Install browser test dependencies
        run: |
          python -m pip install "playwright>=1.48,<2"
          python -m playwright install chromium --with-deps
      - name: Frontend route audit (desktop + mobile)
        run: python scripts/verify_frontend.py --no-shots
