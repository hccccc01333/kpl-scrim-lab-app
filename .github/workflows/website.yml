# 官网构建自检：模板占位符、CHANGELOG 渲染、资源指纹出错都要在这里拦住。
#
# 真正的发布不在这里：官网部署在独立仓库 hccccc01333/kpl-scrim-lab-site
# （GitHub Pages → https://hccccc01333.github.io/kpl-scrim-lab-site/），
# 本仓库没有开启 Pages，所以以前那套 configure-pages / deploy-pages 必然 404。
# 发布走 `python scripts/deploy_site_api.py`，把 website/dist 推到站点仓库。
name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/src/**'
      - 'scripts/build_website.py'
      - 'CHANGELOG.md'
      - 'version.py'
      - 'docs/images/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建官网
        run: python scripts/build_website.py
      - name: 校验产物
        run: |
          test -f website/dist/index.html
          test -f website/dist/sitemap.xml
          ! grep -rq '{{[A-Z_]*}}' website/dist --include='*.html'
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
