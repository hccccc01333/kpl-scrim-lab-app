# 官网自动部署：推送 main 后构建 website/dist 并发布到 GitHub Pages。
# 首次启用：仓库 Settings -> Pages -> Source 选「GitHub Actions」。
name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/src/**'
      - 'scripts/build_website.py'
      - 'CHANGELOG.md'
      - 'version.py'
      - 'docs/images/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建官网
        run: python scripts/build_website.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
