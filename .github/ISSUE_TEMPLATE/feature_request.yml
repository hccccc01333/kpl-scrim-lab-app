name: 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在的做法是什么？哪一步最费时间？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望平台怎么帮你完成这件事？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 涉及环节
      multiple: true
      options:
        - 数据采集
        - 核对入库
        - 比赛复盘
        - 选手分析
        - 团队与阵容
        - 深度分析
        - 专题研究
        - 回放解析
        - 平台体验
        - 其他
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 训练赛的实际情况、教练组的使用习惯等。
