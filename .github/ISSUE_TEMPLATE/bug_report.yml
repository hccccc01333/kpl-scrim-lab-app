name: 识别或数据问题
description: 截图读错、数据对不上、平台报错
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 出问题的环节
      options:
        - 数据采集（截图 / 录屏 / 表格 / 营地链接）
        - 核对入库
        - 比赛复盘
        - 选手分析
        - 团队与阵容
        - 深度分析
        - 专题研究
        - 回放解析
        - 平台体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从打开平台开始，怎么一步步触发这个问题？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充材料
      description: |
        可以附脱敏后的截图说明问题。请不要上传真实对局文件、账号信息或营地登录凭证。
  - type: input
    id: version
    attributes:
      label: 平台版本
      placeholder: 1.0.0
