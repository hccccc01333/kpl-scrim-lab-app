services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./data:/app/data
      # Optional: mount prepared Mimo weights at /app/models/Xiaomi-OCR-0
      # - ./models:/app/models:ro
    environment:
      TRAINING_HOST: "0.0.0.0"
      TRAINING_PORT: "8766"
      TRAINING_DB: /app/data/training.sqlite3
      KPL_RECORDINGS: /app/data/recordings
      # Change to 1 only when exposing the port on a trusted LAN.
      TRAINING_ALLOW_REMOTE: "1"
    restart: unless-stopped
